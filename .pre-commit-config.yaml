repos:
  # --- Core hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-json

  # --- Python lint + format (ruff does both; faster than black/flake8) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff           # lints
      - id: ruff-format    # formats (Black-compatible)

  # --- Type checking ---
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-setuptools
        args: [--strict]
        files: ^(qnotation_be|backend|src)/

  # --- Security & spellcheck ---
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: [-q, -r, qnotation_be]
        exclude: ^testsuites/
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: ["-L", "nd,teh"]

  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest on changed files
        entry: bash -c 'pytest -q'
        language: system
        pass_filenames: false
        stages: [pre-commit]
